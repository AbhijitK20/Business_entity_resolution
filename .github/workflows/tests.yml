name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # indic-transliteration is required by the cross-script tests but is
          # not yet listed in requirements.txt (added in PR #6). Installing it
          # here keeps CI honest instead of silently skipping V1 coverage.
          pip install pytest indic-transliteration

      - name: Run test suite
        run: python -m pytest tests/ -q --no-header

      - name: Verify the official submission validator is importable
        run: python -c "import utils.validate_submission"
